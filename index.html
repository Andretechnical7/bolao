<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bolão do Major</title>
<style>
:root{color-scheme:light dark}
body{font:16px system-ui,sans-serif;max-width:720px;margin:0 auto;padding:12px}
button,select,input{font:inherit;padding:8px 10px}
button{cursor:pointer}
h2,h3{margin:18px 0 6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sel select{width:100%}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #8886}
.box{border:1px solid #8886;border-radius:6px;padding:8px 12px;text-align:center;min-width:110px}
.box b{font-size:1.3em;display:block}
small{opacity:.7}
.won{color:#1a9e47}.lost{color:#d33}
.hide{display:none}
</style>
</head>
<body>

<div id="login">
  <h2>Bolão do Major</h2>
  <button id="btnLogin">Entrar com Google</button>
  <p id="loginMsg"></p>
</div>

<div id="app" class="hide">
  <div class="bar">
    <div class="box"><small>Carteira</small><b id="bal">0</b></div>
    <div class="box"><small>Caixinha (perdido)</small><b id="cx">0</b></div>
    <div><button id="btnOut">Sair</button> <button id="btnReset">Reiniciar</button></div>
  </div>

  <h2>Partida</h2>
  <div class="sel">
    <select id="selA"></select>
    <select id="selB"></select>
    <select id="selM"></select>
  </div>
  <div class="bar">
    <span>Stake: <input id="stake" type="number" min="1" step="1" value="50" style="width:90px"></span>
    <button id="btnShow">Ver apostas</button>
  </div>
  <p id="msg"></p>
  <div id="market"></div>

  <h2>Apostas abertas</h2>
  <div id="open"></div>
  <h2>Histórico</h2>
  <div id="done"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,getDoc,setDoc,getDocs,onSnapshot,query,orderBy,runTransaction,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1) COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE ====== */
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "SEU-PROJETO.firebaseapp.com",
  projectId: "SEU-PROJETO",
  appId: "COLE_AQUI"
};

/* ====== 2) DADOS FICTÍCIOS (troque depois pelos seus números) ======
   wr = chance do time vencer cada mapa (taxa de vitória no mapa)
   players = média de kills por mapa */
const MAPS = ["Mirage","Inferno","Nuke","Ancient","Anubis"];
const TEAMS = {
  "Falcões":  {wr:{Mirage:.62,Inferno:.55,Nuke:.48,Ancient:.58,Anubis:.50},
               players:{Raptor:20.1,Talon:18.4,Skye:17.2,Gale:16.5,Wren:14.8}},
  "Tubarões": {wr:{Mirage:.50,Inferno:.64,Nuke:.57,Ancient:.45,Anubis:.60},
               players:{Fin:19.6,Reef:18.0,Tide:17.5,Coral:16.1,Wave:15.2}},
  "Lobos":    {wr:{Mirage:.44,Inferno:.47,Nuke:.66,Ancient:.60,Anubis:.42},
               players:{Fang:21.0,Howl:18.9,Pack:17.0,Dusk:15.9,Moon:14.2}}
};
const START = 1000;       // pontos iniciais
const DIFF = 0.3;         // peso do fator de dificuldade (kills ajustadas pela chance do time)
const SD = 0.24;          // desvio padrão das kills = 24% da média

/* ====== CONTAS ====== */
const log5 = (a,b) => a*(1-b)/(a*(1-b)+b*(1-a));
const cdf = z => { const t=1/(1+.2316419*Math.abs(z)), d=.3989423*Math.exp(-z*z/2);
  const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; };
const clamp = p => Math.min(.95,Math.max(.05,p));
const odd = p => +(1/p).toFixed(2);

function market(A,B,M){
  const pA = clamp(log5(TEAMS[A].wr[M], TEAMS[B].wr[M]));
  const players = [];
  for(const [t,p] of [[A,pA],[B,1-pA]]){
    for(const [n,avg] of Object.entries(TEAMS[t].players)){
      const mean = avg*(1+DIFF*(p-.5));
      const line = Math.round(mean-.5)+.5;
      const pOver = clamp(1-cdf((line-mean)/(SD*mean)));
      players.push({n,t,avg,mean,line,pOver});
    }
  }
  return {pA,players};
}

/* ====== FIREBASE ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
let uref = null, unsubs = [], balance = 0;

$("btnLogin").onclick = async () => {
  const prov = new GoogleAuthProvider();
  try { await signInWithPopup(auth,prov); }
  catch(e){ try { await signInWithRedirect(auth,prov); } catch(e2){ $("loginMsg").textContent = "Erro no login: "+e2.message; } }
};
$("btnOut").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  unsubs.forEach(u=>u()); unsubs=[];
  $("login").classList.toggle("hide",!!user);
  $("app").classList.toggle("hide",!user);
  if(!user) return;
  uref = doc(db,"users",user.uid);
  try {
    if(!(await getDoc(uref)).exists()) await setDoc(uref,{balance:START,box:0});
  } catch(e){ alert("Erro ao acessar o banco. Verifique as regras do Firestore. "+e.message); return; }
  unsubs.push(onSnapshot(uref, s => {
    const d = s.data(); if(!d) return;
    balance = d.balance;
    $("bal").textContent = d.balance.toFixed(2);
    $("cx").textContent = d.box.toFixed(2);
  }));
  unsubs.push(onSnapshot(query(collection(uref,"bets"),orderBy("ts","desc")), s => {
    renderBets(s.docs.map(d=>({id:d.id,...d.data()})));
  }));
});

/* ====== TELA ====== */
$("selA").innerHTML = $("selB").innerHTML = Object.keys(TEAMS).map(t=>`<option>${esc(t)}</option>`).join("");
$("selB").selectedIndex = 1;
$("selM").innerHTML = MAPS.map(m=>`<option>${esc(m)}</option>`).join("");

function row(label,p,o,desc){
  return `<div class="r"><span>${esc(label)}<br><small>${(p*100).toFixed(1)}% · odd ${o.toFixed(2)}</small></span>`+
         `<button data-d="${esc(desc)}" data-o="${o}">Apostar</button></div>`;
}

$("btnShow").onclick = () => {
  const A=$("selA").value, B=$("selB").value, M=$("selM").value;
  $("msg").textContent = "";
  if(A===B){ $("msg").textContent = "Escolha dois times diferentes."; return; }
  const m = market(A,B,M), ctx = `${A} x ${B} em ${M}`;
  let h = `<h3>Vencedor do mapa</h3>`;
  h += row(`${A} vence ${M}`, m.pA, odd(m.pA), `${A} vence o mapa — ${ctx}`);
  h += row(`${B} vence ${M}`, 1-m.pA, odd(1-m.pA), `${B} vence o mapa — ${ctx}`);
  h += `<h3>Kills dos jogadores</h3>`;
  for(const p of m.players){
    const oo = odd(p.pOver), ou = odd(1-p.pOver);
    h += `<div class="r"><span>${esc(p.n)} <small>(${esc(p.t)})</small><br><small>média ${p.avg.toFixed(1)} · esperado ${p.mean.toFixed(1)} · linha ${p.line}</small></span>`+
      `<span><button data-d="${esc(`${p.n} OVER ${p.line} kills — ${ctx}`)}" data-o="${oo}">Over ${oo.toFixed(2)}</button> `+
      `<button data-d="${esc(`${p.n} UNDER ${p.line} kills — ${ctx}`)}" data-o="${ou}">Under ${ou.toFixed(2)}</button></span></div>`;
  }
  $("market").innerHTML = h;
};

$("market").onclick = e => {
  const b = e.target.closest("button[data-d]"); if(b) place(b.dataset.d, +b.dataset.o);
};

async function place(desc,o){
  const stake = Math.floor(+$("stake").value);
  if(!(stake>0)) return alert("Informe um stake maior que zero.");
  if(stake>balance) return alert("Saldo insuficiente.");
  if(!confirm(`${desc}\nOdd ${o.toFixed(2)} · stake ${stake}\nRetorno se ganhar: ${(stake*o).toFixed(2)}`)) return;
  try {
    await runTransaction(db, async tx => {
      const u = await tx.get(uref), bal = u.data().balance;
      if(stake>bal) throw new Error("Saldo insuficiente.");
      tx.update(uref,{balance:+(bal-stake).toFixed(2)});
      tx.set(doc(collection(uref,"bets")),{desc,odd:o,stake,status:"pending",payout:0,ts:Date.now()});
    });
  } catch(e){ alert(e.message); }
}

async function settle(id,won){
  try {
    await runTransaction(db, async tx => {
      const br = doc(uref,"bets",id), b = await tx.get(br), u = await tx.get(uref);
      const bd = b.data(), d = u.data();
      if(bd.status!=="pending") return;
      const payout = won ? +(bd.stake*bd.odd).toFixed(2) : 0;
      tx.update(br,{status:won?"won":"lost",payout});
      tx.update(uref,{balance:+(d.balance+payout).toFixed(2), box:+(d.box+(won?0:bd.stake)).toFixed(2)});
    });
  } catch(e){ alert(e.message); }
}

$("open").onclick = e => {
  const b = e.target.closest("button[data-id]"); if(b) settle(b.dataset.id, b.dataset.w==="1");
};

function renderBets(list){
  const open = list.filter(b=>b.status==="pending"), done = list.filter(b=>b.status!=="pending");
  $("open").innerHTML = open.map(b=>
    `<div class="r"><span>${esc(b.desc)}<br><small>stake ${b.stake} · odd ${b.odd.toFixed(2)} · retorno ${(b.stake*b.odd).toFixed(2)}</small></span>`+
    `<span><button data-id="${b.id}" data-w="1">Ganhou</button> <button data-id="${b.id}" data-w="0">Perdeu</button></span></div>`
  ).join("") || "<small>Nenhuma aposta aberta.</small>";
  const w = done.filter(b=>b.status==="won").length;
  $("done").innerHTML = (done.length ? `<small>${w} ganhas · ${done.length-w} perdidas</small>` : "<small>Sem histórico ainda.</small>") +
    done.map(b=>
      `<div class="r"><span>${esc(b.desc)}<br><small>stake ${b.stake} · odd ${b.odd.toFixed(2)}</small></span>`+
      `<b class="${b.status}">${b.status==="won"?"+"+(b.payout-b.stake).toFixed(2):"-"+b.stake}</b></div>`
    ).join("");
}

$("btnReset").onclick = async () => {
  if(!confirm(`Apagar todas as apostas e voltar para ${START} pontos?`)) return;
  const s = await getDocs(collection(uref,"bets")), b = writeBatch(db);
  s.forEach(d=>b.delete(d.ref));
  b.set(uref,{balance:START,box:0});
  await b.commit();
};
</script>
</body>
</html>
